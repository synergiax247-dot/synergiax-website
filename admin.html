<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>SynergiaX · Studio Dashboard</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<style>
:root{--void:#050509;--obsidian:#0c0c14;--surface:rgba(255,255,255,.04);--border:rgba(255,255,255,.1);--ind:#7c7dff;--ind2:#b07dff;
  --txt:#e7e7f2;--mut:rgba(255,255,255,.5);--ok:#34d399;--warn:#fbbf24;--bad:#fb7185;--info:#38bdf8;
  --serif:"Instrument Serif",Georgia,serif;--sans:"Inter",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 80% at 50% -10%,#10101f 0%,#070710 50%,#050509 100%);color:var(--txt);font-family:var(--sans);min-height:100vh}
.msym{font-family:"Material Symbols Outlined";font-style:normal;line-height:1;vertical-align:middle}
a{color:inherit}
.hide{display:none!important}

/* gate / sign-in screen */
.gate{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:18px}
.gate__card{background:var(--surface);border:1px solid var(--border);backdrop-filter:blur(20px);border-radius:24px;padding:48px 40px;max-width:420px}
.gate__logo{width:64px;height:64px;border-radius:16px;margin:0 auto 20px;background-size:cover;background-position:center;border:1px solid var(--border)}
.gate h1{font-family:var(--serif);font-size:30px;margin:0 0 8px}
.gate p{color:var(--mut);font-size:14px;line-height:1.6;margin:0 0 24px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:9999px;padding:12px 22px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid transparent;text-decoration:none;transition:transform .2s,background .2s,border-color .2s}
.btn--g{background:#fff;color:#111}
.btn--g:hover{transform:translateY(-1px)}
.btn--ghost{background:var(--surface);border-color:var(--border);color:#fff}
.btn--ghost:hover{border-color:var(--ind);background:rgba(124,125,255,.12)}

/* shell */
.shell{max-width:1320px;margin:0 auto;padding:24px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand__logo{width:40px;height:40px;border-radius:11px;background-size:cover;background-position:center;border:1px solid var(--border)}
.brand__name{font-family:var(--serif);font-size:24px}.brand__tag{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut)}
.who{display:flex;align-items:center;gap:10px}
.who__av{width:36px;height:36px;border-radius:50%;background-size:cover;background-position:center;border:1px solid var(--border)}

/* stat cards */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:22px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;position:relative;overflow:hidden}
.stat__num{font-family:var(--serif);font-size:38px;line-height:1}
.stat__lab{font-size:12px;color:var(--mut);letter-spacing:.04em;margin-top:4px}
.stat::after{content:"";position:absolute;right:-20px;top:-20px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(124,125,255,.18),transparent 70%)}

/* panels */
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;margin-bottom:22px}
@media(max-width:920px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px}
.panel h2{font-family:var(--serif);font-size:20px;margin:0 0 14px;display:flex;align-items:center;gap:8px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:22px}
@media(max-width:920px){.charts{grid-template-columns:1fr}}

/* tabs + toolbar */
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab{background:var(--surface);border:1px solid var(--border);color:var(--mut);border-radius:9999px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer}
.tab.is-active{background:linear-gradient(90deg,var(--ind),var(--ind2));color:#0a0a14;border-color:transparent}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.input,.select{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:10px;padding:9px 14px;color:#fff;font-size:13px;font-family:var(--sans);outline:none}
.input:focus,.select:focus{border-color:var(--ind)}
.input{min-width:200px;flex:1}
.select option{background:#15151f}

/* lead/review cards */
.list{display:flex;flex-direction:column;gap:12px}
.card{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:16px;padding:16px 18px;transition:border-color .2s,transform .2s}
.card:hover{border-color:rgba(124,125,255,.35)}
.card__row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.card__title{font-weight:600;font-size:15px;color:#fff;display:flex;align-items:center;gap:8px}
.card__sub{font-size:12.5px;color:var(--mut);margin-top:2px}
.card__brief{font-size:13.5px;color:rgba(255,255,255,.72);line-height:1.6;margin-top:10px;background:rgba(0,0,0,.2);border-radius:10px;padding:10px 12px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin-top:10px}
.meta a{color:var(--info);text-decoration:none}.meta a:hover{text-decoration:underline}
.badge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:9999px}
.b-type{background:rgba(124,125,255,.16);color:#c7c8ff}
.b-new{background:rgba(124,125,255,.18);color:#c7c8ff}.b-contacted{background:rgba(251,191,36,.16);color:#fbbf24}
.b-won{background:rgba(52,211,153,.16);color:#34d399}.b-lost{background:rgba(251,113,133,.16);color:#fb7185}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.mini{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:9px;padding:7px 12px;cursor:pointer;border:1px solid var(--border);background:rgba(255,255,255,.04);color:#fff;text-decoration:none}
.mini:hover{border-color:var(--ind)}
.mini--reply{background:linear-gradient(90deg,var(--ind),var(--ind2));color:#0a0a14;border-color:transparent}
.mini--del:hover{border-color:var(--bad);color:var(--bad)}
.stars{color:var(--warn);letter-spacing:2px;font-size:14px}
.av{width:38px;height:38px;border-radius:50%;background:rgba(124,125,255,.25);display:flex;align-items:center;justify-content:center;font-weight:700;background-size:cover;background-position:center;flex-shrink:0}
.empty{text-align:center;color:var(--mut);padding:40px;font-size:14px}
.footer{text-align:center;color:rgba(255,255,255,.25);font-size:12px;margin:30px 0 10px}
</style>
</head>
<body>

<!-- GATE: sign-in / access screens -->
<div class="gate" data-gate>
  <div class="gate__card">
    <div class="gate__logo" style="background-image:url('/assets/logo-mark.png')"></div>
    <h1 data-gate-title>Studio Access</h1>
    <p data-gate-msg>Sign in with the SynergiaX business account to continue.</p>
    <button class="btn btn--g" data-gate-signin><span class="msym" style="font-size:18px">login</span> Sign in with Google</button>
    <div data-gate-extra></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="shell hide" data-dash>
  <div class="top">
    <div class="brand">
      <div class="brand__logo" style="background-image:url('/assets/logo-mark.png')"></div>
      <div><div class="brand__name">Studio Dashboard</div><div class="brand__tag">SynergiaX · Admin</div></div>
    </div>
    <div class="who">
      <div class="who__av" data-me-av></div>
      <div style="font-size:13px"><div data-me-name style="font-weight:600"></div><div style="color:var(--mut)" data-me-email></div></div>
      <a href="/" class="mini">View site</a>
      <button class="mini" data-signout><span class="msym" style="font-size:16px">logout</span> Sign out</button>
    </div>
  </div>

  <div class="stats" data-stats></div>

  <div class="charts">
    <div class="panel"><h2><span class="msym" style="color:var(--ind)">donut_small</span> Leads by business type</h2><canvas data-chart-type height="200"></canvas></div>
    <div class="panel"><h2><span class="msym" style="color:var(--ind)">bar_chart</span> Leads (last 8 weeks)</h2><canvas data-chart-time height="200"></canvas></div>
  </div>

  <div class="panel" style="margin-bottom:22px">
    <h2><span class="msym" style="color:var(--ind)">inbox</span> Enquiries</h2>
    <div class="toolbar">
      <input class="input" data-lead-search placeholder="Search name, business, email…"/>
      <select class="select" data-lead-status><option value="">All statuses</option><option value="new">New</option><option value="contacted">Contacted</option><option value="won">Won</option><option value="lost">Lost</option></select>
      <select class="select" data-lead-type><option value="">All types</option></select>
      <select class="select" data-lead-sort><option value="new">Newest first</option><option value="old">Oldest first</option></select>
    </div>
    <div class="list" data-leads></div>
  </div>

  <div class="panel">
    <h2><span class="msym" style="color:var(--ind)">reviews</span> Reviews <span class="badge b-type" data-rev-avg style="margin-left:8px"></span></h2>
    <div class="toolbar">
      <select class="select" data-rev-rating><option value="">All ratings</option><option value="5">5 ★</option><option value="4">4 ★</option><option value="3">3 ★</option><option value="2">2 ★</option><option value="1">1 ★</option></select>
      <select class="select" data-rev-sort><option value="new">Newest first</option><option value="high">Highest rated</option><option value="low">Lowest rated</option></select>
    </div>
    <div class="list" data-reviews></div>
  </div>

  <div class="footer">SynergiaX Studio Dashboard · live data from Firestore</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="./js/sx-admin.js"></script>
</body>
</html>

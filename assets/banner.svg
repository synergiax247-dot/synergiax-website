<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="SynergiaX — Premium websites for local business">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a14"/>
      <stop offset="0.55" stop-color="#0b0a16"/>
      <stop offset="1" stop-color="#050509"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c7dff"/>
      <stop offset="0.5" stop-color="#c0c1ff"/>
      <stop offset="1" stop-color="#b07dff"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.2" r="0.8">
      <stop offset="0" stop-color="#5b5be0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5b5be0" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .wm{font-family:'Georgia','Times New Roman',serif;font-weight:400}
      .sub{font-family:'Segoe UI',Inter,Arial,sans-serif;letter-spacing:.32em}
      .pill{font-family:'Segoe UI',Inter,Arial,sans-serif;letter-spacing:.18em}
      @keyframes fade{0%{opacity:0}100%{opacity:1}}
      .fin{opacity:0;animation:fade 1.1s ease forwards}
      .d1{animation-delay:.2s}.d2{animation-delay:.5s}.d3{animation-delay:.8s}
    </style>
  </defs>

  <rect width="1200" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="22" fill="url(#glow)"/>

  <!-- drifting glass particles -->
  <g fill="#c0c1ff">
    <circle cx="140" cy="70" r="2.5" opacity="0.5"><animate attributeName="cy" values="70;58;70" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="240" r="2" opacity="0.4"><animate attributeName="cy" values="240;255;240" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="80" r="1.8" opacity="0.45"><animate attributeName="cx" values="980;995;980" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="220" cy="250" r="1.6" opacity="0.35"><animate attributeName="cy" values="250;238;250" dur="8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- monogram -->
  <g transform="translate(600,118)" class="fin d1">
    <circle r="46" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.8"/>
    <circle r="46" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.25" filter="url(#soft)"/>
    <text x="0" y="16" text-anchor="middle" class="wm" font-size="46" fill="#ffffff">SX</text>
  </g>

  <text x="600" y="212" text-anchor="middle" class="wm fin d2" font-size="64" fill="#ffffff">SynergiaX</text>
  <text x="600" y="248" text-anchor="middle" class="sub fin d3" font-size="15" fill="#c0c1ff">PREMIUM WEBSITES FOR LOCAL BUSINESS</text>

  <!-- animated underline -->
  <rect x="470" y="266" width="260" height="2" rx="1" fill="url(#accent)">
    <animate attributeName="width" values="0;260;260" dur="1.6s" begin="0.8s" fill="freeze"/>
    <animate attributeName="x" values="600;470;470" dur="1.6s" begin="0.8s" fill="freeze"/>
  </rect>

  <text x="600" y="300" text-anchor="middle" class="pill" font-size="11" fill="#6f6f86">DESIGN  ·  BUILD  ·  LAUNCH  ·  GROW</text>
</svg>
